name: Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build
        run: cargo build --target x86_64-pc-windows-msvc --release --locked

      - name: Validate winget manifest
        shell: pwsh
        run: winget validate pkg/winget/QwerProg.bt.installer.yaml

      - name: Package
        shell: pwsh
        run: |
          $exe = "target/x86_64-pc-windows-msvc/release/bt.exe"
          $zip = "bt-x86_64-windows.zip"
          Compress-Archive -Path $exe -DestinationPath $zip
          $hash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $zip" | Out-File -Encoding ascii SHA256SUMS
          $manifest = "pkg/winget/QwerProg.bt.installer.yaml"
          (Get-Content $manifest) -replace 'InstallerSha256: .+', "InstallerSha256: $hash" | Set-Content $manifest

      - name: Test winget install
        shell: pwsh
        run: |
          $zip = (Resolve-Path "bt-x86_64-windows.zip").Path -replace '\\', '/'
          $manifest = "pkg/winget/QwerProg.bt.installer.yaml"
          (Get-Content $manifest) -replace 'InstallerUrl: .+', "InstallerUrl: file:///$zip" |
            Set-Content test-manifest.yaml
          winget install --manifest test-manifest.yaml `
            --accept-package-agreements --disable-interactivity --silent
          if (-not (Get-Command bt.exe -ErrorAction SilentlyContinue)) {
            throw "bt.exe not found after install"
          }
          Write-Host "winget install test passed"

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            bt-x86_64-windows.zip
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
